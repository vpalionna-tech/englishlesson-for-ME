  :root:not([data-theme="light"]){ --bg:#12102A; --surface:#1C1A3D; --ink:#F2F0FF; --line:#8B82D9; --muted:#BDB8E6; --soft:#2F2B5C; --acc:#9D7BFF; --onacc:#14102B; --good:#1E5A44; --bad:#6B2A25; --focus:#9CC1FF; --a2:#4CC38A; --b1:#7BA8F5; --b2:#F0A060; --onb:#0E0B24; }
}
:root[data-theme="dark"]{ --bg:#12102A; --surface:#1C1A3D; --ink:#F2F0FF; --line:#8B82D9; --muted:#BDB8E6; --soft:#2F2B5C; --acc:#9D7BFF; --onacc:#14102B; --good:#1E5A44; --bad:#6B2A25; --focus:#9CC1FF; --a2:#4CC38A; --b1:#7BA8F5; --b2:#F0A060; --onb:#0E0B24; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:18px;line-height:1.5}
button,select,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ipa{font-family:'Noto Sans','Segoe UI','DejaVu Sans',system-ui,sans-serif}

.stats{display:flex;gap:8px;flex-wrap:wrap}

.wrap{max-width:900px;margin:0 auto;padding:10px 14px 40px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 14px}
.tab{cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 2px 5px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tab .ic{font-size:22px}
.tab[aria-selected="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 14px}
h2{font-size:24px;margin:0 0 4px;font-weight:800}
h3{font-size:17px;margin:16px 0 6px}
.hint{color:var(--muted);font-size:15px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{cursor:pointer;font-weight:700;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:8px 18px;background:var(--surface);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.lime{background:var(--lime);color:#1D1B3A;border-color:#1D1B3A}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:active{transform:translateY(2px)}

.scope{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.scope select{font-weight:600;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface);color:var(--ink);max-width:100%}

.chip.today{background:var(--lime);color:#1D1B3A;border-color:#1D1B3A}
.badge{display:inline-block;border-radius:999px;padding:0 10px;font-size:13px;font-weight:800;color:var(--onb);vertical-align:middle}
.badge.A2{background:var(--a2)} .badge.B1{background:var(--b1)} .badge.B2{background:var(--b2)}
.pos{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;font-weight:700;vertical-align:middle}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}

.fc{text-align:center;padding:10px 4px}
.fc .w{font-size:clamp(34px,8vw,52px);font-weight:800;line-height:1.1;margin:8px 0 2px}

.fc .uk{font-size:26px;font-weight:700;margin:10px 0 4px}
.fc .ex{font-size:19px;margin:6px auto 0;max-width:560px}
.fc .rev{min-height:110px}
.q{font-size:clamp(22px,4.8vw,30px);font-weight:800;line-height:1.3;margin:8px 0 14px}
.sent{font-size:clamp(20px,4.4vw,26px);font-weight:600;line-height:1.4;margin:8px 0 12px}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--acc);text-align:center;padding:0 6px}
.opts{display:grid;gap:10px}

.opt.good{background:var(--good)} .opt.bad{background:var(--bad)} .opt[disabled]{cursor:default}
.fb{margin:12px 0 0;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--good)}
.fb.no{background:var(--bad)} .fb b{display:block}
.inp{width:100%;font-size:26px;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface);color:var(--ink);margin:8px 0 10px;text-align:center}
.inp.ok{background:var(--good)} .inp.no{background:var(--bad)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.th{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.th b{display:block;font-size:16px}
.th .bar{margin-top:6px;height:10px}
.th small{color:var(--muted);font-size:13px}
.big{font-size:44px;font-weight:800;line-height:1}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 14px}
.kpi div{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:var(--surface)}
.kpi small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.steps{margin:6px 0 0;padding-left:22px}
.steps li{margin:4px 0}
.say3{display:grid;gap:10px;margin:10px 0}
.sw{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.sw.used{background:var(--good)}
.sw .t{flex:1}
.sw .t b{font-size:22px}
.timer{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px}

@media (prefers-reduced-motion: reduce){ .btn:active{transform:none} }
</style>

var flt={topic:-1,level:'All',custom:null};
function scopeList(){ return W.filter(function(x){ return (flt.topic<0||x.th===flt.topic)&&(flt.level==='All'||x.lv===flt.level); }); }
function pool(){ return flt.custom||scopeList(); }

   ['All','A2','B1','B2'].map(function(l){ return '<button class="chip" data-lv="'+l+'" aria-pressed="'+(flt.level===l)+'">'+l+'</button>'; }).join('')+
   (flt.custom?'<button class="chip today" id="sClr">Today\'s '+flt.custom.length+' ✕</button>':'<button class="chip today" id="sToday">⭐ Today\'s 10</button>')+'</div>';

function bindScope(redo){
  var t=$('#sTopic'); if(t) t.onchange=function(){ flt.topic=parseInt(this.value,10); flt.custom=null; redo(); };
  var ls=document.querySelectorAll('[data-lv]'); for(var i=0;i<ls.length;i++) ls[i].onclick=function(){ flt.level=this.getAttribute('data-lv'); flt.custom=null; redo(); };
  var td=$('#sToday'); if(td) td.onclick=function(){ var l=shuffle(scopeList().filter(function(x){return box(x.w)<3;})); if(!l.length) l=shuffle(scopeList()); flt.custom=l.slice(0,10); redo(); };
  var cl=$('#sClr'); if(cl) cl.onclick=function(){ flt.custom=null; redo(); };
}
function distract(x,n,field){
  var same=W.filter(function(y){ return y.w!==x.w&&y.pos===x.pos; }), all=W.filter(function(y){ return y.w!==x.w; });
  var out=shuffle(same).slice(0,n); if(out.length<n) out=out.concat(shuffle(all).filter(function(y){ return out.indexOf(y)<0; }).slice(0,n-out.length));
  return out;
}

  h+='<p class="hint">Question '+(mq.i+1)+' of '+mq.list.length+' | Score '+mq.score+'</p><div class="q">'+(mq.dir==='en'?x.w+' <span class="ipa" style="font-weight:400;font-size:.7em;color:var(--muted)">'+x.ipa+'</span>':x.uk)+'</div>'+(canSpeak&&mq.dir==='en'?'<button class="btn lime" id="ls" style="margin-bottom:12px">🔊 Listen</button>':'')+
   '<div class="opts">'+mq.opts.map(function(o,k){ var cls='opt',mk=''; if(an){ if(o===x){ cls+=' good'; mk='✓ '; } else if(k===mq.picked){ cls+=' bad'; mk='✗ '; } } return '<button class="'+cls+'" data-k="'+k+'"'+(an?' disabled':'')+'>'+mk+(mq.dir==='en'?o.uk:o.w)+'</button>'; }).join('')+'</div>';
  if(an){ var ok=mq.opts[mq.picked]===x; h+='<div class="fb'+(ok?'':' no')+'"><b>'+(ok?'Correct!':'Not quite.')+'</b>'+x.w+' = '+x.uk+'<br>'+hl(x.ex,x.w)+'</div><div class="row" style="margin-top:12px"><button class="btn main" id="nx">'+(mq.i===mq.list.length-1?'See result':'Next')+'</button></div>'; }
  h+='</div>'; $('#view').innerHTML=h; bindScope(startMean); bindDir();
  if(canSpeak&&$('#ls')) $('#ls').onclick=function(){ say(x.w); };
  var os=document.querySelectorAll('.opt'); for(var i=0;i<os.length;i++) os[i].onclick=function(){
    if(mq.picked>-1) return; mq.picked=parseInt(this.getAttribute('data-k'),10);
    if(mq.opts[mq.picked]===x){ mq.score++; addScore(); setBox(x.w,box(x.w)+1); } else setBox(x.w,0);
    if(canSpeak) say(x.w); renderMean(); var n=$('#nx'); if(n) n.focus();
  };
  if($('#nx')) $('#nx').onclick=function(){ mq.i++; if(mq.i>=mq.list.length) mq.done=true; else prepMean(); renderMean(); };
}
function bindDir(){ var ds=document.querySelectorAll('[data-d]'); for(var i=0;i<ds.length;i++) ds[i].onclick=function(){ mq.dir=this.getAttribute('data-d'); mq.i=0; mq.score=0; mq.done=false; prepMean(); renderMean(); }; }

/* ============ USE IT (gap fill) ============ */
var us={list:[],i:0,score:0,picked:-1,opts:[],done:false};
function startUse(){ newUse(); }
function newUse(){
  var p=pool().filter(hasW); var low=shuffle(p).sort(function(a,b){ return box(a.w)-box(b.w); }).slice(0,Math.min(10,p.length));
  us={list:shuffle(low),i:0,score:0,picked:-1,opts:[],done:false}; prepUse(); renderUse();
}
function prepUse(){ if(us.i>=us.list.length) return; var x=us.list[us.i]; us.opts=shuffle([x].concat(distract(x,3))); us.picked=-1; }
function renderUse(){
  var h='<div class="card"><h2>Use it</h2><p class="hint">Choose the word that fits the sentence. Context is how you learn to <i>use</i> words.</p><div style="height:10px"></div>'+scopeHTML();
  if(!us.list.length){ h+='<p>No words in this set.</p></div>'; $('#view').innerHTML=h; bindScope(startUse); return; }
  if(us.done||us.i>=us.list.length){
    h+='<h2>'+us.score+' out of '+us.list.length+'</h2><p>'+(us.score>=8?'Excellent!':'Good work. Read the sentences once more aloud.')+'</p><div class="row"><button class="btn main" id="ag">New round</button></div></div>';
    $('#view').innerHTML=h; bindScope(startUse); $('#ag').onclick=newUse; return;
  }
  var x=us.list[us.i], an=us.picked>-1;
  var sent=x.ex.replace(re(x.w),an?'<mark>'+x.w+'</mark>':'<span class="blank">&nbsp;</span>');
  h+='<p class="hint">Question '+(us.i+1)+' of '+us.list.length+' | Score '+us.score+'</p><div class="sent">'+sent+'</div><p class="hint" style="margin-bottom:10px">Hint: '+x.uk+'</p><div class="opts">'+
   us.opts.map(function(o,k){ var cls='opt',mk=''; if(an){ if(o===x){ cls+=' good'; mk='✓ '; } else if(k===us.picked){ cls+=' bad'; mk='✗ '; } } return '<button class="'+cls+'" data-k="'+k+'"'+(an?' disabled':'')+'>'+mk+o.w+'</button>'; }).join('')+'</div>';
  if(an){ var ok=us.opts[us.picked]===x; h+='<div class="fb'+(ok?'':' no')+'"><b>'+(ok?'Correct!':'The answer is "'+x.w+'".')+'</b><span class="ipa">'+x.ipa+'</span> '+x.uk+'</div><div class="row" style="margin-top:12px">'+(canSpeak?'<button class="btn lime" id="ls">🔊 Sentence</button>':'')+'<button class="btn main" id="nx">'+(us.i===us.list.length-1?'See result':'Next')+'</button></div>'; }
  h+='</div>'; $('#view').innerHTML=h; bindScope(startUse);
  if(canSpeak&&$('#ls')) $('#ls').onclick=function(){ say(x.ex); };
  var os=document.querySelectorAll('.opt'); for(var i=0;i<os.length;i++) os[i].onclick=function(){
    if(us.picked>-1) return; us.picked=parseInt(this.getAttribute('data-k'),10);
    if(us.opts[us.picked]===x){ us.score++; addScore(); setBox(x.w,box(x.w)+1); } else setBox(x.w,0);
    renderUse(); var n=$('#nx'); if(n) n.focus();
  };
  if($('#nx')) $('#nx').onclick=function(){ us.i++; if(us.i>=us.list.length) us.done=true; else prepUse(); renderUse(); };
}

/* ============ SPELL ============ */
var sp={list:[],i:0,score:0,state:'',hint:false,done:false};
function startSpell(){ newSpell(); }
function newSpell(){
  var p=pool(); var low=shuffle(p).sort(function(a,b){ return box(a.w)-box(b.w); }).slice(0,Math.min(8,p.length));
  sp={list:shuffle(low),i:0,score:0,state:'',hint:false,done:false}; renderSpell(true);
}
function norm(s){ return s.toLowerCase().replace(/\s+/g,' ').trim(); }
function renderSpell(speak){
  var h='<div class="card"><h2>Spell</h2><p class="hint">Listen, then type the word. If sound is off, use the translation and the transcription.</p><div style="height:10px"></div>'+scopeHTML();
  if(!sp.list.length){ h+='<p>No words in this set.</p></div>'; $('#view').innerHTML=h; bindScope(startSpell); return; }
  if(sp.done||sp.i>=sp.list.length){
    h+='<h2>'+sp.score+' out of '+sp.list.length+'</h2><p>'+(sp.score>=7?'Excellent spelling!':'Good work. Write the missed words by hand two times.')+'</p><div class="row"><button class="btn main" id="ag">New round</button></div></div>';
    $('#view').innerHTML=h; bindScope(startSpell); $('#ag').onclick=newSpell; return;
  }
  var x=sp.list[sp.i];
  var hintTxt=sp.hint?x.w.charAt(0)+x.w.slice(1).replace(/[^ ]/g,'_').split('').join(' ')+'  ('+x.w.length+' letters)':'';
  h+='<p class="hint">Word '+(sp.i+1)+' of '+sp.list.length+' | Score '+sp.score+'</p><div class="fc"><span class="badge '+x.lv+'">'+x.lv+'</span> <span class="pos">'+x.pos+'</span><p class="uk">'+x.uk+'</p><p class="i ipa">'+x.ipa+'</p>'+
   (canSpeak?'<button class="btn lime" id="ls">🔊 Listen</button> ':'')+'<button class="btn" id="hn">💡 Hint</button>'+(hintTxt?'<p class="q" style="margin:10px 0 0;letter-spacing:2px">'+hintTxt+'</p>':'')+'</div>'+
   '<input class="inp'+(sp.state||'')+'" id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the word" placeholder="type here"'+(sp.state==='ok'||sp.state==='reveal'?' disabled':'')+'>';
  if(sp.state==='ok') h+='<div class="fb"><b>Correct!</b>'+hl(x.ex,x.w)+'</div>';
  if(sp.state==='no') h+='<div class="fb no"><b>Not quite.</b>Look at the hint and try once more.</div>';
  if(sp.state==='reveal') h+='<div class="fb no"><b>The word is "'+x.w+'".</b>'+hl(x.ex,x.w)+'</div>';
  h+='<div class="row" style="margin-top:12px">'+((sp.state==='ok'||sp.state==='reveal')?'<button class="btn main" id="nx">'+(sp.i===sp.list.length-1?'See result':'Next word')+'</button>':'<button class="btn main" id="ck">Check</button><button class="btn" id="rv">Show answer</button>')+'</div></div>';
  $('#view').innerHTML=h; bindScope(startSpell);
  var inp=$('#in'); if(inp&&!inp.disabled) inp.focus();
  if(canSpeak&&$('#ls')) $('#ls').onclick=function(){ say(x.w); };
  $('#hn').onclick=function(){ sp.hint=true; var v=inp.value; renderSpell(false); var i2=$('#in'); if(i2&&!i2.disabled){ i2.value=v; i2.focus(); } };
  var tries=sp.tries||0;
  if($('#ck')){ $('#ck').onclick=check; inp.onkeydown=function(e){ if(e.key==='Enter') check(); }; }
  if($('#rv')) $('#rv').onclick=function(){ setBox(x.w,0); sp.state='reveal'; renderSpell(false); };
  if($('#nx')) $('#nx').onclick=function(){ sp.i++; sp.state=''; sp.hint=false; sp.tries=0; if(sp.i>=sp.list.length) sp.done=true; renderSpell(true); };
  function check(){
    if(norm(inp.value)===norm(x.w)){ sp.state='ok'; sp.score++; addScore(); setBox(x.w,box(x.w)+1); if(canSpeak) say(x.w); }
    else { sp.state='no'; sp.hint=true; setBox(x.w,0); }
    renderSpell(false); var n=$('#nx'); if(n) n.focus(); else { var i3=$('#in'); if(i3) i3.focus(); }
  }
  if(speak&&canSpeak&&!sp.state) setTimeout(function(){ say(x.w); },250);
}

/* ============ SAY IT ============ */
var sy={words:[],used:{},show:false,left:60,run:false};
function startSay(){ newSay(); }
function newSay(){
  stopTmr(); var p=pool(); var low=shuffle(p).sort(function(a,b){ return box(a.w)-box(b.w); }).slice(0,Math.min(3,p.length));
  sy={words:shuffle(low),used:{},show:false,left:60,run:false}; renderSay();
}
function renderSay(){
  var h='<div class="card"><h2>Say it</h2><p class="hint">Make your <b>own</b> sentence with each word. Say it out loud. Then tick the word. Using a word yourself is the fastest way to remember it.</p><div style="height:10px"></div>'+scopeHTML();
  if(!sy.words.length){ h+='<p>No words in this set.</p></div>'; $('#view').innerHTML=h; bindScope(startSay); return; }
  h+='<div class="say3">'+sy.words.map(function(x,i){ var u=sy.used[i]; return '<div class="sw'+(u?' used':'')+'"><div class="t"><b>'+x.w+'</b> <span class="badge '+x.lv+'">'+x.lv+'</span> <span class="ipa hint">'+x.ipa+'</span><br><span class="hint">'+x.uk+'</span>'+(sy.show?'<br><span>'+hl(x.ex,x.w)+'</span>':'')+'</div><button class="btn'+(u?' main':'')+'" data-u="'+i+'" aria-pressed="'+(!!u)+'">'+(u?'✓ used':'I used it')+'</button></div>'; }).join('')+'</div>'+
   '<div class="row"><div class="timer" id="tm" role="timer">'+(sy.left>=60?'1:00':'0:'+(sy.left<10?'0':'')+sy.left)+'</div><button class="btn lime" id="st">Start 60 sec</button><button class="btn" id="ex">'+(sy.show?'Hide examples':'💡 Show examples')+'</button></div>'+
   '<p class="hint" style="margin:10px 0">Challenge: use all three words in one short story.</p><div class="row"><button class="btn main" id="nw">New 3 words</button></div></div>';
  $('#view').innerHTML=h; bindScope(startSay);
  var us2=document.querySelectorAll('[data-u]'); for(var i=0;i<us2.length;i++) us2[i].onclick=function(){
    var k=parseInt(this.getAttribute('data-u'),10); if(sy.used[k]) { sy.used[k]=false; } else { sy.used[k]=true; setBox(sy.words[k].w,box(sy.words[k].w)+1); addScore(); } renderSay();
  };
  $('#ex').onclick=function(){ sy.show=!sy.show; renderSay(); };
  $('#nw').onclick=newSay;
  $('#st').onclick=function(){ stopTmr(); sy.left=60; var t=$('#tm'); t.textContent='1:00'; tmr=setInterval(function(){ sy.left--; var e=$('#tm'); if(e) e.textContent='0:'+(sy.left<10?'0':'')+sy.left; if(sy.left<=0){ stopTmr(); } },1000); };
}

upStats();
setTab('home');
</script>
